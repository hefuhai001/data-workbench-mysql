services:
  workbench:
    build: .
    container_name: data-workbench-mysql
    restart: unless-stopped
    ports:
      - "3000:3000"
    # 持久化应用数据（主密码哈希 + 已保存的 MySQL 连接），容器重建不丢失
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    volumes:
      # 持久化 SQLite 数据
      - ./.data:/app/.data
    networks:
      - webnet
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  webnet:
    external: true
